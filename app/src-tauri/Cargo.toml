[package]
name = "kawruh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kawruh — a collaborative markdown notebook"

[lib]
name = "kawruh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kawruh-core = { path = "../../crates/kawruh-core", features = ["tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
sha2.workspace = true
hex.workspace = true
regex = "1"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite.workspace = true
base64.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Importing a Notion export: reads deflate zips only.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# PDF export (print to file) and the debug-build E2E hook's webview snapshots.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
