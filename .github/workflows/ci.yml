name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
        working-directory: app
      # Typechecks and bundles the UI; the Tauri crate embeds app/dist at compile time.
      - run: pnpm build
        working-directory: app

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      - name: Converter contract (Rust ↔ editor, both directions)
        run: scripts/contract.sh
      - run: pnpm test
        working-directory: app
      # pnpm test re-dumps the schema from the real editor. A diff means an editor
      # upgrade changed the schema the Rust converter is checked against.
      - name: Editor schema matches the committed contract
        run: git diff --exit-code crates/kawruh-core/schema.json

  windows:
    name: Desktop app on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build
        working-directory: app
      - run: cargo clippy -p kawruh --all-targets --locked -- -D warnings
      - run: cargo test -p kawruh -p kawruh-core --locked
