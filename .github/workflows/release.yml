name: Release

# Push a version tag (scripts/release.sh makes one) to build the desktop apps
# and server binaries, attach them to a GitHub release and publish it.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches every manifest version
        run: scripts/release.sh --check "$GITHUB_REF_NAME"
      - id: draft
        name: Create the draft (or reuse it on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          if [[ -z "$id" ]]; then
            prerelease=false
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Kawruh $GITHUB_REF_NAME" \
              -F draft=true -F prerelease="$prerelease" -F generate_release_notes=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            rust-targets: ''
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
        working-directory: app

      # Tauri signs and notarizes when these are set, but trips over empty values,
      # so they are exported only when the secrets exist. Without them the app is
      # ad-hoc signed (bundle.macOS.signingIdentity "-").
      - name: Load Apple signing secrets
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!k}" ]]; then
              { echo "$k<<__KAWRUH_EOF__"; printf '%s\n' "${!k}"; echo "__KAWRUH_EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Prefills the server field on the sign-in screen (repo variable, optional).
          VITE_DEFAULT_SERVER: ${{ vars.KAWRUH_DEFAULT_SERVER }}
          # Signs the update bundles (.sig) that installed apps verify before updating.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          # The publish job writes latest.json once both platforms are up.
          uploadUpdaterJson: false

  server:
    name: Server (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p kawruh-server
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="kawruh-server-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" kawruh-server
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

  publish:
    name: Checksums and publish
    needs: [desktop, server]
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME"
          rm -f SHA256SUMS.txt latest.json
          # Update manifest for installed apps (the updater reads
          # releases/latest/download/latest.json).
          python3 - <<'PY'
          import glob, json, os, sys
          from datetime import datetime, timezone
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{tag}"
          def entry(pattern):
              files = [f for f in glob.glob(pattern) if os.path.exists(f + ".sig")]
              if len(files) != 1:
                  sys.exit(f"expected one signed {pattern}, found {files}")
              return {"signature": open(files[0] + ".sig").read().strip(), "url": f"{base}/{files[0]}"}
          mac = entry("*.app.tar.gz")
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"https://github.com/{os.environ['GH_REPO']}/releases/tag/{tag}",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": mac,
                  "darwin-x86_64": mac,
                  "windows-x86_64": entry("*-setup.exe"),
              },
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          PY
          cat latest.json
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" latest.json SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
